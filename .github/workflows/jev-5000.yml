name: Jev 5000 Meme Rank
# trigger-v2

on:
  push:
    paths:
      - ".github/workflows/jev-5000.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:
  rank:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Get GitHub OIDC token
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken();
            core.setSecret(token);
            core.setOutput('token', token);

      - name: Run Jev over 5000 memes
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error, time
          from concurrent.futures import ThreadPoolExecutor, as_completed

          BASE = "https://jev-meme-radar-door-proof.vercel.app/api/run"
          TOKEN = os.environ["OIDC_TOKEN"]

          def fetch_block(offset):
              url = f"{BASE}?limit=100&offset={offset}&batch=25&concurrency=4"
              req = urllib.request.Request(
                  url,
                  headers={
                      "x-vercel-trusted-oidc-idp-token": TOKEN,
                      "User-Agent": "jev-meme-radar-github-action"
                  }
              )
              last = None
              for attempt in range(4):
                  try:
                      with urllib.request.urlopen(req, timeout=120) as r:
                          if r.status != 200:
                              raise RuntimeError(f"HTTP {r.status}")
                          data = json.loads(r.read().decode("utf-8"))
                          if data.get("evaluated") != 100:
                              raise RuntimeError(f"Expected 100 evaluated, got {data.get('evaluated')}")
                          return data
                  except Exception as e:
                      last = e
                      time.sleep(2 * (attempt + 1))
              raise RuntimeError(f"offset {offset} failed: {last}")

          offsets = list(range(0, 5000, 100))
          blocks = []
          with ThreadPoolExecutor(max_workers=5) as ex:
              futs = {ex.submit(fetch_block, o): o for o in offsets}
              for fut in as_completed(futs):
                  o = futs[fut]
                  data = fut.result()
                  blocks.append(data)
                  print(f"offset={o} evaluated={data.get('evaluated')} elapsedMs={data.get('elapsedMs')}")

          candidates = []
          for block in blocks:
              candidates.extend(block.get("top20", []))

          candidates.sort(
              key=lambda x: (
                  float(x.get("score") or 0),
                  float(x.get("confidence") or 0)
              ),
              reverse=True
          )
          top20 = candidates[:20]

          result = {
              "source": "MemeCap train+val",
              "model": "typesafe-ai/jev",
              "evaluated": sum(int(b.get("evaluated") or 0) for b in blocks),
              "blocks": len(blocks),
              "method": "50 blocks x 100; retain block top20; global sort by Jev score then confidence",
              "top20": top20,
          }

          os.makedirs("results", exist_ok=True)
          with open("results/top20.json", "w", encoding="utf-8") as f:
              json.dump(result, f, ensure_ascii=False, indent=2)

          print("FINAL_TOP20")
          for i, x in enumerate(top20, 1):
              item = x.get("item") or {}
              print(i, x.get("index"), x.get("score"), x.get("confidence"), item.get("title"))
          PY

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/top20.json
          git diff --cached --quiet && exit 0
          git commit -m "Save Jev top20 from 5000 memes"
          git push
